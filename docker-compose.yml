version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todoretail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-todoretail_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todoretail} -d ${POSTGRES_DB:-todoretail_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-service:
    build:
      context: ./python-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-todoretail}:${POSTGRES_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-todoretail_db}
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      db:
        condition: service_healthy
      python-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "8100:80"
    depends_on:
      - backend

volumes:
  postgres_data:
